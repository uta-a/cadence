name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build .mpp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # buildAndroid adds classes.dex, which Morphe Manager needs. It must run last:
      # a plain `build` (also run by generatePatchesList) writes the .mpp again without it.
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:generatePatchesList :patches:buildAndroid --no-daemon

      - name: Check the bundle has DEX
        run: unzip -l patches/build/libs/patches-*[0-9].mpp | grep -q classes.dex

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: disk-mpp
          path: |
            patches/build/libs/patches-*[0-9].mpp
            patches-list.json
